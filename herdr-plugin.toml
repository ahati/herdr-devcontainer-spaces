# Devcontainer Spaces for Herdr — discover devcontainers, create Herdr spaces with
# in-container shells, and surface in-container coding agents as first-class agents.
id = "devcontainer-spaces"
name = "Devcontainer Spaces"
version = "0.4.0"
min_herdr_version = "0.9.0"   # verified against 0.9.3 (layout.apply, pane.report_agent, agent explain --file)
description = "Detect devcontainers (docker/podman), create spaces with in-container shells, and make agents started inside those containers show up as Herdr agents"
platforms = ["linux", "macos"]

# After session restore: rediscover devcontainers, repair spaces, restart the watcher.
[[startup]]
command = ["node", "scripts/startup.js"]

[[actions]]
id = "rescan"
title = "Devcontainers: rescan and create spaces"
contexts = ["workspace"]
command = ["node", "scripts/discover.js"]

# Action invoked with an argument to clear tombstones (bind to a key or run via
# `herdr plugin action invoke devcontainer-spaces.resurrect`).
[[actions]]
id = "resurrect"
title = "Devcontainers: rescan (re-create closed spaces)"
contexts = ["workspace"]
command = ["node", "scripts/discover.js", "--resurrect"]

[[actions]]
id = "shell-here"
title = "Devcontainers: open in-container shell here"
contexts = ["workspace"]
command = ["node", "scripts/open-shell.js"]

[[actions]]
id = "agent-here"
title = "Devcontainers: start agent in this space"
contexts = ["workspace"]
command = ["node", "scripts/start-agent.js"]

# Shortcuts — ctrl+alt family is the documented safe space for plugin bindings
# (herdr's prefix is ctrl+b; most prefix chords are taken by built-ins).
[[keys.command]]
key = "ctrl+alt+r"
type = "plugin_action"
command = "devcontainer-spaces.rescan"
description = "Devcontainers: rescan and create spaces"

[[keys.command]]
key = "ctrl+alt+shift+r"
type = "plugin_action"
command = "devcontainer-spaces.resurrect"
description = "Devcontainers: rescan (re-create closed spaces)"

[[keys.command]]
key = "ctrl+alt+h"
type = "plugin_action"
command = "devcontainer-spaces.shell-here"
description = "Devcontainers: open in-container shell here"

[[keys.command]]
key = "ctrl+alt+g"
type = "plugin_action"
command = "devcontainer-spaces.agent-here"
description = "Devcontainers: start agent in this space"

[[events]]
on = "workspace.closed"
command = ["node", "scripts/on-workspace-closed.js"]

# Terminal auto-conversion is event-driven at runtime: the startup hook spawns
# scripts/events-subscribe.js (node), which holds a socket event subscription and
# invokes scripts/on-terminal-created.sh per tab/pane event — the manifest
# [[events]] whitelist (herdr 0.9.3) does not include tab/pane lifecycle names.

# Fallback pane entrypoints (used when layout.apply is unavailable, or via the
# shell-here / agent-here actions).
[[panes]]
id = "dc-shell"
title = "devcontainer shell"
placement = "split"
command = ["node", "scripts/pane-shell.js"]

[[panes]]
id = "dc-agent"
title = "devcontainer agent"
placement = "split"
command = ["node", "scripts/pane-agent.js"]
